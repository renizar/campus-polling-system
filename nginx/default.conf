server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    sendfile off;                       # agar perubahan bind mount langsung terbaca
    add_header Cache-Control "no-store";

    # Browser memanggil /api/... -> Nginx meneruskan ke service "backend" lewat DNS Docker
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
    }
}
