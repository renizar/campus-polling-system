name: campus-polling

services:
  backend:
    build: ./backend
    container_name: polling-backend
    restart: unless-stopped
    volumes:
      - polling-db-data:/var/lib/backend_data   # Named Volume (data permanen)
    networks:
      - app-net

  frontend:
    image: nginx:alpine
    container_name: polling-frontend
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro        # Bind Mount (UI live-edit)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  polling-db-data:

networks:
  app-net:
    driver: bridge
